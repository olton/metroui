<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link href="../lib/metro.css" rel="stylesheet">
    <link href="../lib/icons.css" rel="stylesheet">

    <title>Linked Block - Metro UI :: Popular HTML, CSS and JS library</title>
    <style>
        .linked-block {
            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>
<body class="cloak h-100-vh">
<nav data-role="appbar" class="border-bottom bd-default" data-expand="true">
    <div class="app-bar-item-static no-hover">
        <div class="text-leader">Linked Block</div>
    </div>
    <div class="app-bar-container" style="position: absolute; left: 50%; transform: translateX(-50%);">
        <button onclick="createBlock()">Create Block</button>
    </div>
    <div class="app-bar-item-static no-hover ml-auto">
        <input type="checkbox" data-role="theme-switcher"/>
    </div>
</nav>

<main id="container" class="h-100 pos-relative" style="--linked-block-point-color: #ff0000;"></main>

<script src="../lib/metro.js"></script>
<script>
    var blockCount = 0;
    function createBlock () {
        blockCount++;
        const block1 = Metro.linkedBlock.create({
            content: `Block ${blockCount}`,
            container: $('#container'),
            top: 100,
            left: 100,
            resizable: true,
        });
        block1.addPoint('east')

        blockCount++;
        const block2 = Metro.linkedBlock.create({
            content: `Block ${blockCount}`,
            container: $('#container'),
            top: 100,
            left: 300,
            resizable: true,
        });
        block2.addPoint('west')

        block1.connect(block2.element, {
            type: "curve"
        })
    }
</script>
</body>
</html>
